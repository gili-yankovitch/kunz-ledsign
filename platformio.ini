; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c6]
platform = espressif32
board = seeed_xiao_esp32c6
framework = espidf
; Board JSON says 4 MB; many XIAO C6 units are 2 MB — mismatch breaks app header read (boot loop).
board_upload.flash_size = 2MB
; Safer on some 2 MB parts than default qio from the board manifest.
board_build.flash_mode = dio
board_build.partitions = partitions_2mb.csv
; Pin the board's USB-CDC port so auto-detect never grabs /dev/cu.Bluetooth-*.
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
